name: NPM Deploy to Github Pages

on:
  push:
    branches:
      - main
    paths:
      - bn-filter-app/**

defaults:
  run:
    # change to frontend dir
    working-directory: ./bn-filter-app

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: bn-filter-app/package-lock.json

      - name: Update browserlist
        run: npx update-browserslist-db@latest

      - name: Set Git config
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions-bot"
          git remote set-url origin https://github-actions-bot:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY

      - name: Install dependencies
        run: npm ci

      - name: Deploy GH pages
        run: npm run deploy
